# ============================================================
# Logging
# ============================================================

# Log levels
# DEBUG, INFO, WARNING, ERROR, CRITICAL
[logging.console]
# Can be overridden with:
#   --loglevel LEVEL
#   --debug all
level = "INFO"

# how high the loglevel of dependencies should be in the console
# Can be overridden with:
#   --debug dependencies
#   --debug all
dependency_level = "WARNING"

[logging.file]
# how high the loglevel of vidsift should be when logging to vidsift.jsonl
level = "INFO"
# how high the loglevel of dependency logs should be when logging to vidsift.jsonl
dependency_level = "WARNING"
rotation = "midnight"        # D: Daily, H: Hourly, M: every minute, S: every second, midnight: at midnight
retain_days = 14             # for how many days the logs should be kept
utc_time = false             # true: UTC time, false: local time

# ============================================================
# Video fetching
# ============================================================
[video_fetching]
rss_bozo_level = "permissive" # permissive (log warning), strict (fail on bozo error), ignore (fully ignore bozo), debug (log bozo exception)

# how many videos should be fetched when falling back to yt-dlp.
# With not enough, some videos might get skipped.
# But with too much, it takes longer and amplifies the risk of being blocked
yt_dlp_video_amount = 10

# ============================================================
# AI
# ============================================================
# --global-ai-model MODEL
#
# Overrides the model reference for every AI task.
#
# Overrides:
# [ai.tasks.metadata_validation]
# reference = "<MODEL>"
#
# [ai.tasks.transcript_validation]
# reference = "<MODEL>"
#
# [ai.tasks.chunk_summary]
# reference = "<MODEL>"
#
# [ai.tasks.overall_summary]
# reference = "<MODEL>"
#
# Only the model reference is changed. Context length,
# thinking mode and max_tokens remain unchanged.
[ai]
# how often AI can run and fail to output the requested JSON
# for smaller local AI models, it is usually 2-3 times
max_allowed_json_output_runs = 3


# IMPORTANT:
# Use this option only for testing if possible.
#
# Only set to true if the configured AI model fails the startup
# compatibility checks. This bypasses those checks and lets
# vidsift attempt to run anyway.
#
# AI failures are treated as hard failures, so if the model
# is actually incompatible, background runs will continue to fail.
#
# However, if AI works but the checks still fail, then it should be set to true
#
# CLI override:
# --skip-ai-checks sets the value to true
skip_ai_checks = false


base_url = "http://localhost:11434" # which base url the provider should use
provider = "ollama"                 # ollama, lmstudio

[ai.tasks.metadata_validation]
reference = "qwen3.5:9b" # ai model name, can be overriden with --global-ai-model MODEL
context_length = 8192    # the context length that the ai should get
thinking = false         # only works with ollama, for lmstudio it has to be configured at the server side
max_tokens = 500         # how many tokens the AI can max. output. cannot exeed the context length


[ai.tasks.transcript_validation]
reference = "qwen3.5:9b" # ai model name, can be overriden with --global-ai-model MODEL
context_length = 8192
thinking = true
max_tokens = 7000


[ai.tasks.chunk_summary]
reference = "qwen3.5:9b" # ai model name, can be overriden with --global-ai-model MODEL
context_length = 8192
max_tokens = 500
thinking = false


[ai.tasks.overall_summary]
reference = "qwen3.5:9b" # ai model name, can be overriden with --global-ai-model MODEL
context_length = 8192
max_tokens = 7000
thinking = true


# ============================================================
# Video processing
# ============================================================
[video_processing]
# how often a video can fail in total before it gets marked as FAILED and gets abandoned
# use vidsift videos list --status failed to list all the failed videos
max_retry_attempts = 1


# wether interrupted videos should be processed in the first place
# When false, they will be processed before checking for any new videos.
# It is recommended to keep the value false because else
# if vidsift gets interrupted because of missing internet connection,
# a pc shutdown, or a failure with one video
# the video that was being processed gets skipped
# CLI Override:
# --skip-interrupted to set this setting to true

skip_interrupted_vids = false


# same as skip_interrupted_vids, but applies to new videos.
# When false, vidsift will check for new videos
# When true, vidsift will not check for any new videos
# It is recommended to keep the value false because else
# no new videos get processed.

# CLI Override:
# --skip-new to set this setting to true
# When the value is false, it disables:
# - video_processing.days_uploaded_before
# - video_fetching block
skip_new_vids = false


# How recent videos should be.
# The RSS feeds can contain month or even year old videos that may not be wanted
# This limits the newly processed videos to the upload date between today and today - the value
# This is especially useful when just having installed vidsift to set it low to not get videos that may
# have already been watched
# It does NOT affect interrupted or failed videos, only new ones
#
# It is recommended to keep the value low for beginning, and set it to 7 for example later
# because you may have already watched the videos of the configured channels that are more than one day old
# and 1 is the minimum.
days_uploaded_before = 1

# how much seconds vidsift should sleep after having processed one video at minimum, (min_vid_delay)
# then how much of random secods will be added (between 0 and random_vid_delay)
# int (< 30)
min_vid_delay = 300 # 5 minutes
# int(< 10)
random_vid_delay = 240 # 4 minutes


[video_processing.yt_dlp.base] # wether interrupted videos should be processed
# all of these settings are passed to yt-dlp, every time it is used
# yt-dlp is used for data fetching for one video (including filtering), transcript fetching, video download
max_retries = 10
sleep_requests = 10              # seconds
cookies_from_browser = "firefox" # brave, chrome, chromium, edge, firefox, opera,  safari,  vivaldi,  whale

# wether yt-dlp should be quiet or not, if false, yt-dlp will print a lot of output to the console
# for starting and testing it is recommended to set this option to false to see wether yt-dlp works in the first place
# Can be overridden with:
#   --debug yt-dlp
#   --debug all
quiet = true

[[video_processing.yt_dlp.base.js_runtimes]]
# wich js runtimes should be used
# at least one have to be configured
# the options are: deno, node, bun, quickjs
name = "deno"
path = "/absulute/path/to/deno" # optional

[[video_processing.yt_dlp.base.js_runtimes]]
name = "node"


[video_processing.yt_dlp.download]
# download-specific options for yt-dlp
# these options will always be passed to yt-dlp whenever it downloads a video
# used alongside base yt-dlp args for downloading
merge_output_format = "mkv"         # output format for merged video and audio
format = "bestvideo+bestaudio/best" # yt-dlp format string

# ============================================================
# Validation
# ============================================================

[validation]
# how many chars should roughly be in one transcript chunk
# the amount of chars getting to the AI are a bit more than 5 x transcript_chunk_char_size
# meaning that with 500 the ai gets 2500 chars of the transcript
# the actual size can vary because it gets cut by words
transcript_chunk_char_size = 500 # (<100), int


# ============================================================
# Validation - Pre Validation
# ============================================================

[validation.pre_validation.max_allowed] # (0-1), float
title_punctuation_ratio = 0.07   # how many punctuations (.?!) can be in the title to pass relative to the total char amount of the title
title_uppercase_ratio = 0.4      # how many uppercase can chars there can be relative to the total char amount
title_emoji_ratio = 0.15         # how many emojis there can be relative to the total char amount
title_clickbait_ratio = 0.15     # how many common clickbait phrases there can be relative to the total char amount
transcript_clickbait_ratio = 0.1 # how many common clickbait phrases there can be relative to the total char amount

[validation.pre_validation.weak] # 0-1, float
title_uppercase_ratio = 0.2
title_emoji_ratio = 0.03
title_punctuation_ratio = 0.04
title_clickbait_ratio = 0.05
transcript_clickbait_ratio = 0.02

[validation.pre_validation.weights] # (0-10), float
title_uppercase_weight = 1.0
title_emoji_weight = 1.0
title_punctuation_weight = 0.5
title_clickbait_weight = 1.5
transcript_clickbait_weight = 2.5


# ============================================================
# Summarization
# ============================================================

[summarization]
# how many chars should roughly be in one chunk for summarization
# the higher the value, the less chunks there are meaning that there there can be less ai calls for the total video
# however, it should not be too high because of the context length
# it is recommended to check the selected models context length for chunk summarization first
char_chunk_size = 10000
output_dir = "/home/user/Documents/vidsift/" # under which directory summarized videos should be saved

# wether the video metadata should be shown on the top
# of the file containing the video summary
# When enabled, the file has the following structure:
# <Video metadata>
# <Video summary>
# When disabled, the file will rather look like this:
# <Video summary>
show_metadata_on_summary = true


# ============================================================
# Downloads
# ============================================================

[downloads]
# Where the downloaded video should be stored.
# If fake_download is True,
# if output_path is not provided, the path for writing 
# would have downloaded video links is output_dir / "to_watch.md"
# Can be overridden:
#   if fake_download = true
#   and output_path is set
output_dir = "/home/user/Videos/.vidsift/"

# when true, vidsift will not download the video, 
# but still append it to the specified output_dir to 'to_watch.md'
# that filename can be configured with output_file field.
# Config override with:
# vidsift run --fake-download /optional/path/to/output/file
# vidsift schedule --fake-download /optional/path/to/output/file
# vidsift process --url "someurl" --download --fake-download /optional/path/to/output/file
fake_download = false

# full path of the file that will be created in the when fake_download is true
# it is not required
# Overrides output_dir
# Config override with:
# vidsift run --fake-download /optional/path/to/output/file
# vidsift schedule --fake-download /optional/path/to/output/file
# vidsift process --url "someurl" --download --fake-download /optional/path/to/output/file
output_path = "/home/user/Documents/to_watch.md"


# ============================================================
# Channels
# ============================================================

# id: Channelid
# 1. Go to channel homepage (for example https://www.youtube.com/@PewDiePie)
# 2. Click on "more" below the subscriber amount
# 3. (you may have to scroll down), click on share channel
# 4. Click on "Copy channel ID"

# actions:
#   - download: downloads each video from the channel, skipping validation
#   - validate: validate each new video, that decides wether the video will be downloaded, summarized or discarded
#   - summarize: summarize each new video from the channel, skipping validation

# instruction:
# - optional for actions 'download' and 'summarize' cause it is not used for these actions
# - required for action 'validate'
# - value: filename of a file located at the user config dir / vidsift / custom_channel_instructions
# - that file at user config dir / vidsift / custom_channel_instructions / [VALUE]
#   are the custom channel instructions for validation where you can
#   tell the AI how you want any video of that channel be validated
# - it is allowed to use one file multiple times, for example use a file called linux_channels.md for all the channels about linux
# - the file has to be a file that is plain text (read with mode 'r')


[[channels]]
id = "UC9x0AN7BWHpCDHSm9NiJFJQ" # NetworkChuck
action = "download"

[[channels]]
id = "UCo71RUe6DX4w-Vd47rFLXPg"   # typecraft_dev
action = "validate"
instruction = "linux_channels.md"

[[channels]]
id = "UC4JX40jDee_tINbkjycV4Sg" # TechWithTim
action = "summarize"
