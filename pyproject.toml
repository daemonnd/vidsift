[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsift"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.4.22",
    "charset-normalizer==3.4.7",
    "defusedxml==0.7.1",
    "emoji==2.15.0",
    "feedparser==6.0.12",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.16",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "ollama==0.6.2",
    "packaging==26.2",
    "pathvalidate==3.3.1",
    "platformdirs==4.10.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "requests==2.33.1",
    "rich==15.0.0",
    "sgmllib3k==1.0.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.6.9",
    "psutil==7.2.2",
    "portalocker==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "debugpy==1.8.20"]

[project.scripts]
vidsift = "vidsift.main:main"

[tool.setuptools.packages.find]
where = ["src"]
