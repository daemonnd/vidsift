[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsift"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "emoji>=2.15.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "openai>=2.44.0",
    "pathvalidate>=3.3.1",
    "platformdirs>=4.10.0",
    "portalocker>=3.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.6.9",
]


[project.scripts]
vidsift = "vidsift.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["debugpy>=1.8.20", "pytest>=9.0.3"]
